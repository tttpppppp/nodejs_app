openapi: 3.0.0
info:
  title: Nodejs API
  version: 1.0.0

servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: 8080

paths:
  /user/all:
    get:
      tags:
        - Lấy tất cả người dùng
      summary: Get all users
      description: Lấy danh sách tất cả user với phân trang
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Trang hiện tại
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Số lượng user trên 1 trang
      responses:
        "200":
          description: Danh sách user
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                  total:
                    type: integer
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
